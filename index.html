<style>
  body { margin:0; overflow:hidden; background:#fcfbf8; }
  canvas { display:block; }
  #randomize { position:fixed; right:20px; top:20px; width:32px; height:32px; padding:6px; border:1px solid #cfcdc6;
    border-radius:50%; background:none; color:#9a9890; cursor:pointer; transition:.2s; }
  #randomize:hover { color:#1a1a1a; border-color:#1a1a1a; }
  #about { position:fixed; left:0; top:0; bottom:0; width:min(680px, 54vw); box-sizing:border-box; overflow-y:auto; scrollbar-width:thin;
    padding:0 clamp(24px, 5vw, 72px); display:flex; flex-direction:column; color:#1a1a1a; font:17px/1.65 "Iowan Old Style", Georgia, serif; }
  #about .in { margin:auto 0; padding:48px 0; }
  #about h1 { margin:0 0 28px; white-space:nowrap; font:400 clamp(30px, 4.2vw, 56px)/1.05 "Iowan Old Style", Georgia, serif; letter-spacing:-.02em; }
  #about p { margin:0 0 32px; }
  #about p a { color:inherit; text-decoration:none; border-bottom:1px solid #cfcdc6; transition:border-color .2s; }
  #about p a:hover { border-color:#1a1a1a; }
  #about h2 { margin:0 0 14px; color:#9a9890; font:600 11px system-ui, sans-serif; letter-spacing:.14em; text-transform:uppercase; }
  #about section { margin-bottom:28px; }
  .list { display:flex; flex-wrap:wrap; gap:12px 22px; }
  .p { display:inline-flex; align-items:center; gap:.5em; color:inherit; text-decoration:none; font-size:16px; }
  .p span.n { border-bottom:1px solid #d8d6cf; transition:border-color .2s; }
  .p:hover span.n { border-color:#1a1a1a; }
  .ic { flex:none; width:1.7em; height:1.7em; border-radius:.5em; display:grid; place-items:center; background:linear-gradient(135deg, var(--a), var(--b));
    box-shadow:0 2px 6px -1px color-mix(in srgb, var(--b) 55%, transparent); transition:transform .25s cubic-bezier(.3,1.6,.5,1); }
  .p:hover .ic { transform:rotate(-8deg) scale(1.18); }
  .ic svg { width:62%; height:62%; fill:none; stroke:#fff; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .contact { display:flex; align-items:center; gap:18px; margin-top:36px; font:13px system-ui, sans-serif; letter-spacing:.04em; }
  .contact a { color:inherit; text-decoration:none; }
  .contact a.t { border-bottom:1px solid #cfcdc6; }
  .contact a.t:hover { border-color:#1a1a1a; }
  .contact .i { width:18px; height:18px; color:#9a9890; transition:color .2s; }
  .contact .i:hover { color:#1a1a1a; }
  .contact .i svg { display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .contact .i svg.f { fill:currentColor; stroke:none; }
  @media (max-width:760px) {
    #about { top:auto; width:auto; right:0; max-height:55vh; padding:0 24px; background:rgba(252,251,248,.92); font-size:15px; }
    #about .in { margin:0; padding:20px 0 24px; }
    #about h1 { font-size:30px; margin-bottom:12px; } #about p { margin-bottom:20px; }
  }
  #randomize svg { display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
</style>
